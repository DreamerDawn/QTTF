name: Deploy QTTF v2 to GitHub Pages

# 注意：GitHub 只会读取仓库根目录的 .github/workflows/。
# 若要让本文件生效，请把它复制到根目录：
#   .github/workflows/deploy-qttf-v2.yml
# 不要覆盖旧版部署工作流；两者可以使用不同的 workflow 名称和 Pages 目标。

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-qttf-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-qttf-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate data contract
        run: pnpm validate

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
