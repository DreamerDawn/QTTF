# QTTF Decap CMS 配置
#
# 本地：npm run dev 会同时启动 Vite 与 decap-server，打开
#       http://127.0.0.1:5173/QTTF/admin/ 即可直接编辑 src/data/*.json。
# 线上：GitHub backend 需要一个 OAuth 代理。把 oauth-worker/ 部署到
#       Cloudflare Workers 后，将下面的 base_url 换成真实地址。
#
# 官方参考：
# - https://decapcms.org/docs/github-backend/
# - https://decapcms.org/docs/decap-proxy/

backend:
  name: github
  repo: dreamerdawn/QTTF
  branch: main
  base_url: https://qttf-decap-oauth.example.workers.dev
  auth_endpoint: /auth
  commit_messages:
    create: 'cms: 新建 {{collection}} “{{slug}}”'
    update: 'cms: 更新 {{collection}} “{{slug}}”'
    delete: 'cms: 删除 {{collection}} “{{slug}}”'
    uploadMedia: 'cms: 上传 “{{path}}”'
    deleteMedia: 'cms: 删除 “{{path}}”'

local_backend: true
publish_mode: simple

site_url: https://dreamerdawn.github.io/QTTF/
display_url: https://dreamerdawn.github.io/QTTF/
logo:
  src: https://dreamerdawn.github.io/QTTF/QTTF.png
  show_in_header: true

media_folder: public/uploads
public_folder: /QTTF/uploads

locale: zh_Hans
search: false

collections:
  # =========================================================
  # 赛事：元信息 + 阶段/小组/轮次 + 比赛 + 选手 + 领奖台
  # =========================================================
  - name: events
    label: 赛事与赛程
    label_singular: 赛事
    description: 编辑 src/data/events.json。赛事元信息、阶段、小组、轮次与比赛都在这里。
    files:
      - name: events
        label: 赛事数据
        file: src/data/events.json
        editor:
          preview: false
        fields:
          - { label: Schema 版本, name: schemaVersion, widget: number, value_type: int, default: 2 }
          - label: 赛事系列
            name: groups
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { label: ID, name: id, widget: string, hint: '例如 qttc、classleague' }
              - { label: 名称, name: name, widget: string }
              - { label: 简介, name: description, widget: text }
              - label: 强调色
                name: accent
                widget: select
                options:
                  - { label: 蓝色, value: blue }
                  - { label: 紫色, value: violet }
                  - { label: 橙色, value: orange }
                  - { label: 绿色, value: green }

          - label: 赛事
            name: events
            widget: list
            summary: '{{fields.meta.name}}'
            fields:
              - { label: ID, name: id, widget: string, hint: '唯一，例如 qttc-2025' }
              - { label: 路由, name: route, widget: string, hint: '例如 events/qttc/qttc2025/' }
              - label: 所属系列
                name: group
                widget: select
                options: [qttc, zgcup, tryout, classleague]
              - label: 状态
                name: status
                widget: select
                options:
                  - { label: 已发布, value: published }
                  - { label: 整理中, value: coming-soon }
              - label: 元信息
                name: meta
                widget: object
                fields:
                  - { label: 简称, name: name, widget: string }
                  - { label: 全称, name: fullName, widget: string }
                  - { label: 赛制, name: format, widget: string }
                  - label: 日期范围
                    name: dateRange
                    widget: object
                    fields:
                      - { label: 开始, name: start, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
                      - { label: 结束, name: end, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
                  - { label: 场馆, name: venue, widget: string, required: false }
                  - { label: 简介, name: description, widget: text }
              - label: 参赛选手
                name: participants
                widget: list
                required: false
                summary: '{{fields.name}}'
                fields:
                  - { label: 姓名, name: name, widget: string }
                  - { label: 种子号, name: seed, widget: number, value_type: int, required: false }
                  - { label: 排名, name: rank, widget: number, value_type: int, required: false }
                  - { label: 积分, name: points, widget: number, value_type: int, required: false }
                  - { label: 小组, name: group, widget: string, required: false }
                  - { label: 晋级状态, name: qualified, widget: string, required: false }
              - label: 领奖台
                name: podium
                widget: object
                required: false
                fields:
                  - { label: 冠军, name: first, widget: object, required: false, fields: &podium_item_fields [{ label: 姓名, name: name, widget: string }, { label: 排名, name: rank, widget: number, value_type: int, required: false }, { label: 积分, name: points, widget: number, value_type: int, required: false }] }
                  - { label: 亚军, name: second, widget: object, required: false, fields: *podium_item_fields }
                  - { label: 季军, name: third, widget: object, required: false, fields: *podium_item_fields }
              - label: 阶段
                name: stages
                widget: list
                summary: '{{fields.name}}'
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: 名称, name: name, widget: string }
                  - label: 类型
                    name: type
                    widget: select
                    options:
                      - { label: 小组赛, value: group }
                      - { label: 淘汰赛, value: knockout }
                      - { label: 其他, value: other }
                  - label: 小组
                    name: groups
                    widget: list
                    required: false
                    summary: '{{fields.name}}'
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: 名称, name: name, widget: string }
                      - label: 比赛
                        name: matches
                        widget: list
                        summary: '第 {{fields.number}} 场'
                        fields: &match_item_fields
                          - { label: ID, name: id, widget: string }
                          - { label: 场次号, name: number, widget: number, value_type: int, required: false }
                          - { label: 排序, name: order, widget: number, value_type: int, required: false }
                          - { label: 选手, name: players, widget: list, field: { label: 姓名, name: player, widget: string } }
                          - label: 大比分
                            name: score
                            widget: object
                            required: false
                            fields:
                              - { label: 胜局, name: gamesWon, widget: number, value_type: int }
                              - { label: 负局, name: gamesLost, widget: number, value_type: int }
                          - { label: 胜者, name: winner, widget: string, required: false, hint: '平局请留空，且大比分相等' }
                          - label: 状态
                            name: status
                            widget: select
                            options:
                              - { label: 已完成, value: completed }
                              - { label: 轮空, value: bye }
                              - { label: 弃赛, value: default }
                              - { label: 取消, value: cancelled }
                              - { label: 未开始, value: scheduled }
                          - label: 详情
                            name: detail
                            widget: object
                            fields:
                              - label: 每局比分
                                name: sets
                                widget: list
                                required: false
                                summary: '{{fields.pointsWon}} - {{fields.pointsLost}}'
                                fields:
                                  - { label: 己方得分, name: pointsWon, widget: number, value_type: int }
                                  - { label: 对方得分, name: pointsLost, widget: number, value_type: int }
                              - { label: 时长（分钟）, name: durationMinutes, widget: number, value_type: int, required: false }
                              - { label: 暂停, name: timeouts, widget: list, required: false, field: { label: 是否有暂停, name: value, widget: boolean } }
                              - { label: 医疗暂停, name: medicalTimeouts, widget: list, required: false, field: { label: 是否有医疗暂停, name: value, widget: boolean } }
                              - label: 总得分
                                name: totalPoints
                                widget: object
                                required: false
                                fields:
                                  - { label: 己方, name: pointsWon, widget: number, value_type: int }
                                  - { label: 对方, name: pointsLost, widget: number, value_type: int }
                              - { label: 场馆, name: venue, widget: string, required: false }
                              - { label: 比赛日期, name: playedAt, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
                              - { label: 比赛时间, name: time, widget: string, required: false, hint: 'HH:MM，例如 14:15' }
                              - { label: 备注, name: note, widget: text, required: false }
                          - { label: 标记, name: flags, widget: list, required: false, field: { label: 标记, name: flag, widget: string }, hint: '例如 final、bronze' }
                  - label: 淘汰轮次
                    name: rounds
                    widget: list
                    required: false
                    summary: '{{fields.name}}'
                    fields:
                      - { label: ID, name: id, widget: string }
                      - { label: 名称, name: name, widget: string }
                      - { label: 排序, name: order, widget: number, value_type: int, required: false }
                      - label: 比赛
                        name: matches
                        widget: list
                        summary: '第 {{fields.number}} 场'
                        fields: *match_item_fields

  # =========================================================
  # 联赛：元信息 + 积分榜 + 区域 + 最近 N 场
  # =========================================================
  - name: leagues
    label: 联赛积分榜
    label_singular: 联赛
    description: 编辑 src/data/leagues.json。区域颜色由 tone 语义字段决定，页面统一映射。
    files:
      - name: leagues
        label: 联赛数据
        file: src/data/leagues.json
        editor:
          preview: false
        fields:
          - { label: Schema 版本, name: schemaVersion, widget: number, value_type: int, default: 2 }
          - label: 联赛
            name: leagues
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { label: ID, name: id, widget: string }
              - { label: 路由, name: route, widget: string }
              - { label: 所属系列, name: group, widget: string, default: classleague }
              - label: 状态
                name: status
                widget: select
                options:
                  - { label: 已发布, value: published }
                  - { label: 整理中, value: coming-soon }
              - { label: 全名, name: name, widget: string }
              - { label: 简称, name: shortName, widget: string }
              - { label: 级别, name: tier, widget: string }
              - { label: 赛季, name: season, widget: string }
              - { label: 轮次, name: round, widget: string }
              - { label: 更新时间, name: lastUpdated, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
              - { label: 赛制, name: format, widget: string }
              - { label: 最近战绩长度, name: formLength, widget: number, value_type: int, default: 3 }
              - label: 积分榜
                name: standings
                widget: list
                summary: '{{fields.rank}} · {{fields.team}}'
                fields:
                  - { label: 排名, name: rank, widget: number, value_type: int }
                  - { label: 队伍/选手, name: team, widget: string }
                  - { label: 场次, name: matches, widget: number, value_type: int }
                  - { label: 胜, name: wins, widget: number, value_type: int }
                  - { label: 平, name: draws, widget: number, value_type: int }
                  - { label: 负, name: losses, widget: number, value_type: int }
                  - { label: 胜局, name: gamesWon, widget: number, value_type: int }
                  - { label: 负局, name: gamesLost, widget: number, value_type: int }
                  - { label: 净胜局, name: gameDifference, widget: number, value_type: int }
                  - { label: 积分, name: points, widget: number, value_type: int }
                  - label: 最近 N 场（lastN）
                    name: lastN
                    widget: list
                    required: false
                    hint: 'N 由数组长度决定；W=胜，D=平，L=负，空字符串=无记录。'
                    field:
                      label: 结果
                      name: result
                      widget: select
                      options:
                        - { label: 胜, value: W }
                        - { label: 平, value: D }
                        - { label: 负, value: L }
                        - { label: 无记录, value: '' }
              - label: 每周赛况
                name: matchweeks
                widget: list
                required: false
                summary: '{{fields.label}}'
                hint: '逐场联赛比分。平局时 winner 留空且大比分相等；每局小分填写在 detail.sets。'
                fields:
                  - { label: ID, name: id, widget: string, hint: '例如 qsl-2025-26-ii-r1' }
                  - { label: 周次名称, name: label, widget: string, hint: '例如 第1轮' }
                  - { label: 比赛日期, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
                  - label: 比赛
                    name: matches
                    widget: list
                    summary: '第 {{fields.number}} 场'
                    fields: *match_item_fields
              - label: 区域
                name: zones
                widget: list
                required: false
                summary: '{{fields.name}}'
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: 名称, name: name, widget: string }
                  - { label: 起始名次, name: from, widget: number, value_type: int }
                  - { label: 结束名次, name: to, widget: number, value_type: int }
                  - label: 语义颜色
                    name: tone
                    widget: select
                    options:
                      - { label: 晋级/校运区（绿）, value: qualify }
                      - { label: 附加赛区（蓝）, value: playoff }
                      - { label: 降级区（灰）, value: relegation }
                  - { label: 排序, name: order, widget: number, value_type: int, required: false }
              - { label: 补充说明, name: notes, widget: text, required: false }

  # =========================================================
  # 排名：快照 + 行 + 变化 + 历史
  # =========================================================
  - name: rankings
    label: 选手排名
    label_singular: 排名快照
    description: 编辑 src/data/rankings.json。历史快照按月份保留。
    files:
      - name: rankings
        label: 排名数据
        file: src/data/rankings.json
        editor:
          preview: false
        fields:
          - { label: Schema 版本, name: schemaVersion, widget: number, value_type: int, default: 2 }
          - { label: 当前快照 ID, name: current, widget: string }
          - label: 快照
            name: snapshots
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { label: ID, name: id, widget: string, hint: '例如 2026-01' }
              - { label: 路由, name: route, widget: string }
              - { label: 显示名称, name: label, widget: string }
              - label: 状态
                name: status
                widget: select
                options:
                  - { label: 已发布, value: published }
                  - { label: 暂无数据, value: unavailable }
              - { label: 标题, name: title, widget: string }
              - { label: 简介, name: description, widget: text }
              - label: 排名行
                name: rows
                widget: list
                required: false
                summary: '{{fields.rank}} · {{fields.player}}'
                fields:
                  - { label: 序号, name: rank, widget: number, value_type: int }
                  - { label: 并列名次, name: position, widget: number, value_type: int }
                  - label: 变化
                    name: movement
                    widget: object
                    fields:
                      - label: 方向
                        name: direction
                        widget: select
                        options:
                          - { label: 上升, value: up }
                          - { label: 下降, value: down }
                          - { label: 新上榜, value: new }
                          - { label: 无变化, value: none }
                      - { label: 变化名次, name: places, widget: number, value_type: int, default: 0 }
                  - { label: 积分, name: points, widget: number, value_type: int }
                  - { label: 选手, name: player, widget: string }
                  - label: 历史记录
                    name: history
                    widget: list
                    required: false
                    summary: '{{fields.event}}'
                    fields:
                      - { label: 赛事, name: event, widget: string }
                      - { label: 积分失效日, name: expiresOn, widget: string }
                      - { label: 名次代码, name: position, widget: string, hint: 'W/F/B/SF/QF/R16/G3L/DNP' }
                      - { label: 积分, name: points, widget: number, value_type: int }

  # =========================================================
  # 站点：导航、首页轮播、关于、联系方式
  # =========================================================
  - name: site
    label: 站点设置
    label_singular: 站点
    description: 编辑 src/data/site.json。首页轮播、导航、关于与联系方式。
    files:
      - name: site
        label: 站点数据
        file: src/data/site.json
        editor:
          preview: false
        fields:
          - { label: Schema 版本, name: schemaVersion, widget: number, value_type: int, default: 2 }
          - label: 站点信息
            name: site
            widget: object
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 全称, name: fullName, widget: string }
              - { label: 标语, name: tagline, widget: string }
              - { label: 简介, name: description, widget: text }
              - { label: Logo 路径, name: logo, widget: string }
              - { label: 页脚文字, name: footer, widget: string }
              - { label: GitHub 仓库, name: repository, widget: string }
          - label: 导航
            name: navigation
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { label: 名称, name: label, widget: string }
              - { label: 路径, name: path, widget: string, hint: '首页留空；其他如 events/' }
          - label: 首页
            name: home
            widget: object
            fields:
              - { label: 种子选手数量, name: seedCount, widget: number, value_type: int, default: 8 }
              - label: 轮播
                name: slides
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: 标题, name: title, widget: string }
                  - { label: 描述, name: description, widget: text }
                  - { label: 路径, name: path, widget: string }
                  - label: 主题
                    name: theme
                    widget: select
                    options: [rose, teal, navy, violet, sunset]
          - label: 关于我们
            name: about
            widget: object
            fields:
              - { label: 宗旨, name: motto, widget: string }
              - { label: 副标题, name: tagline, widget: string, hint: '显示在宗旨大标题下方' }
              - label: 关键档案
                name: facts
                widget: list
                required: false
                summary: '{{fields.label}} · {{fields.value}}'
                fields:
                  - { label: 标签, name: label, widget: string }
                  - { label: 数值, name: value, widget: string }
              - { label: 简介, name: intro, widget: text }
              - { label: 理念, name: values, widget: text }
              - label: 历史
                name: history
                widget: list
                summary: '{{fields.date}} · {{fields.text}}'
                fields:
                  - { label: 日期, name: date, widget: string, hint: 'YYYY-MM' }
                  - { label: 事件, name: text, widget: string }
          - label: 联系方式
            name: contact
            widget: object
            fields:
              - { label: 邮箱, name: email, widget: string }
              - { label: B 站链接, name: bilibili, widget: string }
              - { label: B 站显示名, name: bilibiliLabel, widget: string }
              - { label: 联系说明, name: note, widget: text }
