<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>QTTF 内容管理</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f8fb;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #nc-root {
        min-height: 100vh;
      }
      .cms-fallback {
        max-width: 680px;
        margin: 12vh auto;
        padding: 28px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 14px;
        background: #fff;
        color: #0b1220;
        box-shadow: 0 12px 40px rgba(2, 6, 23, 0.08);
      }
      .cms-fallback h1 {
        margin: 0 0 8px;
        color: #4a63e8;
        font-size: 22px;
      }
      .cms-fallback p,
      .cms-fallback li {
        color: #52627a;
        line-height: 1.65;
      }
      .cms-fallback code {
        padding: 2px 5px;
        border-radius: 5px;
        background: #eef4ff;
        color: #0052cc;
      }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>
    <noscript>
      <div class="cms-fallback">
        <h1>QTTF 内容管理</h1>
        <p>Decap CMS 需要启用 JavaScript。</p>
      </div>
    </noscript>
    <script>
      // 动态注入，避免 Vite 把 config.yml 当作普通资源重命名；
      // 同时保证 GitHub Pages 子路径下也能定位到 admin/config.yml。
      (function () {
        var link = document.createElement('link');
        link.rel = 'cms-config-url';
        link.type = 'text/yaml';
        link.href = new URL('./config.yml', window.location.href).href;
        document.head.appendChild(link);
      })();

      window.setTimeout(function () {
        var root = document.getElementById('nc-root');
        if (root && root.children.length === 0) {
          if (root.dataset.fallbackShown) return;
          root.dataset.fallbackShown = '1';
          root.innerHTML =
            '<div class="cms-fallback"><h1>内容编辑器未能加载</h1>' +
            '<p>请检查网络是否可以访问 unpkg.com，或按 README 使用本地模式：</p>' +
            '<ol><li>在 <code>v2/</code> 运行 <code>npm run dev</code></li>' +
            '<li>打开 <code>http://127.0.0.1:5173/QTTF/admin/</code></li></ol>' +
            '<p>生产登录还需要完成 GitHub OAuth Worker 配置（见 README）。</p></div>';
        }
      }, 15000);
    </script>
    <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  </body>
</html>
