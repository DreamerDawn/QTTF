<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f1f1" />
    <title>QTTF · 站点已迁移至新版</title>
    <meta name="description" content="QTTF 丘班乒乓球联合会站点已迁移至新版，旧版栏目停止对外提供。" />
    <link rel="canonical" href="https://dreamerdawn.github.io/QTTF/next/" />
    <link rel="icon" href="QTTF.png" />
    <meta http-equiv="refresh" content="4; url=next/" />
    <style>
      :root {
        --bg: #f2f1f1;
        --surface: #ffffff;
        --surface-subtle: rgba(255, 255, 255, 0.62);
        --text: #171717;
        --text-strong: #0d0d0d;
        --text-muted: #5f5f5f;
        --text-subtle: #737373;
        --border: rgba(23, 23, 23, 0.1);
        --accent: #4d6bfe;
        --accent-strong: #3f5be8;
        --accent-soft: rgba(77, 107, 254, 0.1);
        --radius: 18px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 18px 40px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --surface: #151515;
          --surface-subtle: rgba(255, 255, 255, 0.05);
          --text: #ededed;
          --text-strong: #f7f7f7;
          --text-muted: #a9a9a9;
          --text-subtle: #7d7d7d;
          --border: rgba(255, 255, 255, 0.12);
          --accent: #7ca7ff;
          --accent-strong: #9dbcff;
          --accent-soft: rgba(103, 153, 254, 0.14);
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 40px rgba(0, 0, 0, 0.42);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        color: var(--text);
        background:
          radial-gradient(680px 420px at 12% -10%, var(--accent-soft), transparent 62%),
          var(--bg);
        font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        width: min(100%, 560px);
        padding: clamp(28px, 5vw, 44px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-subtle);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 40px; height: 40px; border-radius: 10px; object-fit: contain;
        background: var(--surface); border: 1px solid var(--border);
      }
      .brand-name { color: var(--accent); font-size: 1.05rem; font-weight: 800; letter-spacing: 0.01em; }
      .eyebrow {
        margin: 22px 0 6px;
        color: var(--text-subtle);
        font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      }
      h1 { margin: 0; color: var(--text-strong); font-size: clamp(1.55rem, 4.6vw, 2rem); line-height: 1.28; letter-spacing: -0.01em; }
      .lead { margin: 12px 0 0; color: var(--text-muted); }
      .note {
        margin: 18px 0 0;
        padding: 12px 14px;
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--text-muted);
        font-size: 0.86rem;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 10px 20px;
        border: 1px solid transparent; border-radius: 12px;
        font: inherit; font-weight: 700; text-decoration: none;
        transition: background 0.16s, border-color 0.16s, transform 0.16s;
      }
      .btn--primary { color: #fff; background: var(--accent-strong); }
      .btn--primary:hover { transform: translateY(-1px); }
      .btn--ghost { color: var(--text-strong); background: var(--surface); border-color: var(--border); }
      .btn--ghost:hover { border-color: var(--accent); }
      .countdown { margin: 18px 0 0; color: var(--text-subtle); font-size: 0.8rem; }
      .tools { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); }
      .tools-title { margin: 0 0 10px; color: var(--text-subtle); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      .tool-list { display: grid; gap: 8px; }
      .tool {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface);
        color: var(--text-strong); text-decoration: none; font-weight: 650;
        transition: border-color 0.16s;
      }
      .tool:hover { border-color: var(--accent); }
      .tool span { color: var(--text-muted); font-size: 0.78rem; font-weight: 400; }
      footer { margin-top: 24px; color: var(--text-subtle); font-size: 0.76rem; }
      footer a { color: var(--text-muted); }
      @media (max-width: 430px) {
        .actions { flex-direction: column; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <img class="logo" src="QTTF.png" alt="" width="40" height="40" />
        <span class="brand-name">QTTF</span>
      </div>

      <p class="eyebrow">Site relocated</p>
      <h1>站点已迁移至新版</h1>
      <p class="lead">
        丘班乒乓球联合会网站已完成 2026 重构。旧版栏目不再对外提供，赛事签表、选手排名与赛果均已迁入新版。
      </p>
      <p class="note" id="fallback-note">如果没有自动跳转，请点击下方按钮进入新版站点。</p>

      <div class="actions">
        <a class="btn btn--primary" href="next/" id="enter-link">进入新版站点</a>
        <a class="btn btn--ghost" href="next/events/">浏览赛事</a>
      </div>
      <p class="countdown" id="countdown">4 秒后自动跳转…</p>

      <section class="tools">
        <p class="tools-title">比赛工具</p>
        <div class="tool-list">
          <a class="tool" href="draw/">
            比赛抽签器
            <span>单打 / 双打 · 小组赛与淘汰赛</span>
          </a>
          <a class="tool" href="pingpong-scorer/">
            比赛计分器
            <span>BO3/5/7 与固定 K 局 · 逐球统计</span>
          </a>
        </div>
      </section>

      <footer>
        仓库 <a href="https://github.com/DreamerDawn/QTTF">DreamerDawn/QTTF</a>
        ｜ 数据由丘班乒乓球联合会提供
      </footer>
    </main>

    <script>
      (function () {
        var seconds = 4;
        var label = document.getElementById('countdown');
        var target = new URL('next/', location.href).href;
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (reduce) {
          if (label) label.textContent = '点击上方按钮进入新版站点';
        } else {
          var timer = setInterval(function () {
            seconds -= 1;
            if (label) label.textContent = seconds + ' 秒后自动跳转…';
            if (seconds <= 0) {
              clearInterval(timer);
              location.replace(target);
            }
          }, 1000);
        }

        // 跳转失败（如离线）时保留手动入口
        window.addEventListener('online', function () {});
      })();
    </script>
  </body>
</html>
