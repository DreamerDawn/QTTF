<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f1f1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · QTTF</title>
    <meta name="description" content="该页面不存在或旧版页面已停止对外提供，请前往 QTTF 新版站点。" />
    <link rel="icon" href="/QTTF/QTTF.png" />
    <style>
      :root {
        --bg: #f2f1f1;
        --surface: #ffffff;
        --surface-subtle: rgba(255, 255, 255, 0.62);
        --text: #171717;
        --text-strong: #0d0d0d;
        --text-muted: #5f5f5f;
        --text-subtle: #737373;
        --border: rgba(23, 23, 23, 0.1);
        --accent: #4d6bfe;
        --accent-strong: #3f5be8;
        --accent-soft: rgba(77, 107, 254, 0.1);
        --radius: 18px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 18px 40px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --surface: #151515;
          --surface-subtle: rgba(255, 255, 255, 0.05);
          --text: #ededed;
          --text-strong: #f7f7f7;
          --text-muted: #a9a9a9;
          --text-subtle: #7d7d7d;
          --border: rgba(255, 255, 255, 0.12);
          --accent: #7ca7ff;
          --accent-strong: #9dbcff;
          --accent-soft: rgba(103, 153, 254, 0.14);
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 40px rgba(0, 0, 0, 0.42);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        color: var(--text);
        background:
          radial-gradient(680px 420px at 12% -10%, var(--accent-soft), transparent 62%),
          var(--bg);
        font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        width: min(100%, 560px);
        padding: clamp(28px, 5vw, 44px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-subtle);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 40px; height: 40px; border-radius: 10px; object-fit: contain;
        background: var(--surface); border: 1px solid var(--border);
      }
      .brand-name { color: var(--accent); font-size: 1.05rem; font-weight: 800; }
      .code {
        margin: 22px 0 0;
        color: var(--accent);
        font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em;
      }
      h1 { margin: 6px 0 0; color: var(--text-strong); font-size: clamp(1.5rem, 4.4vw, 1.95rem); line-height: 1.3; }
      .lead { margin: 12px 0 0; color: var(--text-muted); }
      .note {
        margin: 18px 0 0;
        padding: 12px 14px;
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--text-muted);
        font-size: 0.86rem;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 10px 20px;
        border: 1px solid transparent; border-radius: 12px;
        font: inherit; font-weight: 700; text-decoration: none;
        transition: background 0.16s, border-color 0.16s, transform 0.16s;
      }
      .btn--primary { color: #fff; background: var(--accent-strong); }
      .btn--primary:hover { transform: translateY(-1px); }
      .btn--ghost { color: var(--text-strong); background: var(--surface); border-color: var(--border); }
      .btn--ghost:hover { border-color: var(--accent); }
      footer { margin-top: 24px; color: var(--text-subtle); font-size: 0.76rem; }
      footer a { color: var(--text-muted); }
      @media (max-width: 430px) {
        .actions { flex-direction: column; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <img class="logo" src="/QTTF/QTTF.png" alt="" width="40" height="40" />
        <span class="brand-name">QTTF</span>
      </div>

      <p class="code">404 · NOT FOUND</p>
      <h1>页面不存在或已下线</h1>
      <p class="lead">
        你访问的地址不存在。如果它来自旧版网站，说明该栏目已在 2026 重构中停止对外提供。
      </p>
      <p class="note">
        旧版的赛事、排名、关于与联系页面已全部并入新版站点，内容保留且持续更新。
      </p>

      <div class="actions">
        <a class="btn btn--primary" href="/QTTF/next/">前往新版首页</a>
        <a class="btn btn--ghost" href="/QTTF/next/events/">浏览赛事</a>
      </div>

      <footer>
        仓库 <a href="https://github.com/DreamerDawn/QTTF">DreamerDawn/QTTF</a>
        ｜ 数据由丘班乒乓球联合会提供
      </footer>
    </main>
  </body>
</html>
